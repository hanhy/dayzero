name: dayzero
services:
  db:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: dayzero
      POSTGRES_PASSWORD: dayzero_local
      POSTGRES_DB: dayzero
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - dayzero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dayzero -d dayzero']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://dayzero:dayzero_local@db:5432/dayzero
      HOST: 0.0.0.0
      PORT: 3188
      MODEL_MASTER_KEY: ${MODEL_MASTER_KEY:-}
    ports:
      - '127.0.0.1:3188:3188'
    command: ['sh', '-c', 'npm run db:migrate && npm start']
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3188/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://dayzero:dayzero_local@db:5432/dayzero
      PYTHON_BIN: /opt/venv/bin/python
    command: ['npm', 'run', 'worker']
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      app:
        condition: service_healthy
volumes:
  dayzero_pg:
