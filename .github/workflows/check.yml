name: Dayzero checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r scripts/clustering/requirements.txt
      - run: npm run check
      - run: npm run build
      - run: npm run verify:cluster
      - run: docker compose up -d --wait db
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://dayzero:dayzero_local@127.0.0.1:54329/dayzero
      - run: npm run verify:workflow
        env:
          DATABASE_URL: postgresql://dayzero:dayzero_local@127.0.0.1:54329/dayzero
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://dayzero:dayzero_local@127.0.0.1:54329/dayzero
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestone-evidence
          path: artifacts/
